<svg width="920" height="460" viewBox="0 0 920 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse-blue {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes scan-track {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Pro Mono', 'Segoe UI Mono', 'Roboto Mono', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, Helvetica, Arial, sans-serif;
    }
    .category-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #93C5FD;
    }
    .badge-bg {
      fill: #1E3A8A;
    }
    .card-bg {
      fill: #0B192C;
      stroke: #1E3A8A;
      stroke-width: 1.2;
    }
    .pill-bg {
      fill: #10243E;
      stroke: #1E426F;
      stroke-width: 1;
    }
    .pill-text {
      font-size: 11.5px;
      font-weight: 500;
      fill: #E2E8F0;
    }
    .pill-dot {
      fill: #38BDF8;
    }
    .pulse-pip {
      animation: pulse-blue 2.4s infinite ease-in-out;
    }
    .scan-line {
      stroke: #2563EB;
      stroke-width: 1.5;
      stroke-dasharray: 20 100;
      animation: scan-track 4s infinite linear;
    }
  </style>

