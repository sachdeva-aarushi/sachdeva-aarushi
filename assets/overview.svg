<svg width="620" height="415" viewBox="0 0 620 415" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Pro Mono', 'Segoe UI Mono', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
    }
  </style>

  <!-- Outer Console Container -->
  <rect x="1" y="1" width="618" height="413" rx="8" fill="#07111E" stroke="#1E3A8A" stroke-width="1.2" />

  <!-- Console Header Bar -->
  <circle cx="18" cy="20" r="4" fill="#38BDF8" />
  <text x="28" y="24" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#93C5FD">SYSTEM_DIRECTIVE // OVERVIEW &amp; PRINCIPLES</text>
  <text x="602" y="24" class="mono" font-size="10" fill="#60A5FA" text-anchor="end">STATUS: ACTIVE // 2ND_YEAR</text>
  <line x1="16" y1="34" x2="604" y2="34" stroke="#1E3A8A" stroke-width="1" opacity="0.5" />

  <!-- Top Credential Chips Row -->
  <g transform="translate(16, 44)">
    <rect width="144" height="22" rx="4" fill="#1D4ED8" />
    <circle cx="10" cy="11" r="2.5" fill="#38BDF8" />
    <text x="18" y="15" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">2ND YEAR CS (AI/ML)</text>

    <rect x="152" y="0" width="186" height="22" rx="4" fill="#10243E" stroke="#1E426F" stroke-width="1" />
    <text x="160" y="15" class="mono" font-size="10" font-weight="600" fill="#38BDF8">AI/ML DEV @ GDG ONCAMPUS</text>

    <rect x="346" y="0" width="132" height="22" rx="4" fill="#10243E" stroke="#1E426F" stroke-width="1" />
    <text x="354" y="15" class="mono" font-size="10" font-weight="500" fill="#93C5FD">3X HACKATHON WINNER</text>

    <rect x="486" y="0" width="102" height="22" rx="4" fill="#10243E" stroke="#1E426F" stroke-width="1" />
    <text x="494" y="15" class="mono" font-size="10" font-weight="500" fill="#60A5FA">GSSoC TOP 2%</text>
  </g>

  <!-- Shortened, High-Personality Bio -->
  <g transform="translate(16, 76)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      I don't wrap basic API endpoints, prompt-engineer toy demos, or call fine-tuning a wrapper
    </text>
    <text x="0" y="32" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      engineering. As a <tspan fill="#38BDF8" font-weight="600">2nd-year student</tspan> and <tspan fill="#38BDF8" font-weight="600">AI/ML Developer at GDG OnCampus</tspan>, I engineer
    </text>
    <text x="0" y="50" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      deterministic systems built to tackle messy operational complexity under real-world pressure.
    </text>
  </g>

  <!-- Section Header for Principles -->
  <g transform="translate(16, 142)">
    <text x="0" y="10" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#38BDF8">// CORE OPERATING PRINCIPLES</text>
    <line x1="170" y1="7" x2="588" y2="7" stroke="#1E3A8A" stroke-width="0.8" opacity="0.5" />
  </g>

  <!-- 2x2 Grid of Principles Cards -->
  <!-- Card 1: Top Left -->
  <g transform="translate(16, 160)">
    <rect width="288" height="102" rx="6" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.2" />
    <rect x="10" y="10" width="176" height="18" rx="3" fill="#10243E" stroke="#1E426F" stroke-width="0.8" />
    <circle cx="16" cy="19" r="2" fill="#38BDF8" />
    <text x="24" y="23" class="mono" font-size="9" font-weight="700" fill="#93C5FD">FIRST-PRINCIPLES &gt; HYPE</text>
    <text x="10" y="44" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">Understand the loss functions, telemetry</text>
    <text x="10" y="60" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">math, and underlying architecture &#8212; not</text>
    <text x="10" y="76" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">just high-level framework wrappers.</text>
    <text x="10" y="93" class="mono" font-size="8.5" fill="#60A5FA">&#8618; depth over surface abstractions</text>
  </g>

  <!-- Card 2: Top Right -->
  <g transform="translate(316, 160)">
    <rect width="288" height="102" rx="6" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.2" />
    <rect x="10" y="10" width="194" height="18" rx="3" fill="#10243E" stroke="#1E426F" stroke-width="0.8" />
    <circle cx="16" cy="19" r="2" fill="#38BDF8" />
    <text x="24" y="23" class="mono" font-size="9" font-weight="700" fill="#93C5FD">DETERMINISTIC GUARDRAILS</text>
    <text x="10" y="44" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">Probabilistic outputs are liabilities</text>
    <text x="10" y="60" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">without safety governance. Systems must</text>
    <text x="10" y="76" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">fail safely, predictably, and verifiably.</text>
    <text x="10" y="93" class="mono" font-size="8.5" fill="#60A5FA">&#8618; zero ungrounded generation</text>
  </g>

  <!-- Card 3: Bottom Left -->
  <g transform="translate(16, 272)">
    <rect width="288" height="102" rx="6" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.2" />
    <rect x="10" y="10" width="186" height="18" rx="3" fill="#10243E" stroke="#1E426F" stroke-width="0.8" />
    <circle cx="16" cy="19" r="2" fill="#38BDF8" />
    <text x="24" y="23" class="mono" font-size="9" font-weight="700" fill="#93C5FD">VELOCITY WITH ZERO FLUFF</text>
    <text x="10" y="44" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">Idea &#8594; stress-test &#8594; production code.</text>
    <text x="10" y="60" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">I build at hackathon velocity, but ship</text>
    <text x="10" y="76" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">with modular, production-grade hygiene.</text>
    <text x="10" y="93" class="mono" font-size="8.5" fill="#60A5FA">&#8618; working software before dawn</text>
  </g>

  <!-- Card 4: Bottom Right -->
  <g transform="translate(316, 272)">
    <rect width="288" height="102" rx="6" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.2" />
    <rect x="10" y="10" width="186" height="18" rx="3" fill="#10243E" stroke="#1E426F" stroke-width="0.8" />
    <circle cx="16" cy="19" r="2" fill="#38BDF8" />
    <text x="24" y="23" class="mono" font-size="9" font-weight="700" fill="#93C5FD">TACTICAL CRAFT &amp; UI/UX</text>
    <text x="10" y="44" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">Even complex agentic architectures</text>
    <text x="10" y="60" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">and data pipelines deserve intentional,</text>
    <text x="10" y="76" class="sans" font-size="11" font-weight="400" fill="#CBD5E1">art-directed, low-latency interfaces.</text>
    <text x="10" y="93" class="mono" font-size="8.5" fill="#60A5FA">&#8618; systems should feel powerful</text>
  </g>

  <!-- Footer Telemetry Strip -->
  <line x1="16" y1="386" x2="604" y2="386" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
  <text x="16" y="401" class="mono" font-size="9.5" fill="#60A5FA">// STACK: AUTONOMOUS AGENTS &#8226; APPLIED ML &#8226; FAULT-TOLERANT ARCHITECTURE &#8226; LOW-LATENCY SYSTEMS</text>
</svg>