<svg width="620" height="235" viewBox="0 0 620 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Pro Mono', 'Segoe UI Mono', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
    }
  </style>

  <!-- Outer Console Container -->
  <rect x="1" y="1" width="618" height="233" rx="8" fill="#07111E" stroke="#1E3A8A" stroke-width="1.2" />

  <!-- Console Header Bar -->
  <circle cx="18" cy="20" r="4" fill="#38BDF8" />
  <text x="28" y="24" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#93C5FD">TARGET_ACQUISITION // OPERATIONAL_BOTTLENECKS</text>
  <text x="602" y="24" class="mono" font-size="10" fill="#60A5FA" text-anchor="end">RADAR: LOCKED // ENGAGED</text>
  <line x1="16" y1="34" x2="604" y2="34" stroke="#1E3A8A" stroke-width="1" opacity="0.5" />

  <!-- Directive Body Text -->
  <g transform="translate(16, 46)">
    <text x="0" y="12" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      Every architecture I design is locked onto an actual operational bottleneck. If a system doesn't
    </text>
    <text x="0" y="28" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      move needles in <tspan fill="#38BDF8" font-weight="600">industrial safety</tspan>, <tspan fill="#38BDF8" font-weight="600">commodity liquidity</tspan>, <tspan fill="#38BDF8" font-weight="600">civic integrity</tspan>, or <tspan fill="#38BDF8" font-weight="600">clinical triage</tspan>,
    </text>
    <text x="0" y="44" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      it doesn't leave my local branch. I build for high-consequence environments.
    </text>
  </g>

  <!-- Telemetry Cards 2x2 Grid -->
  <!-- Metric 1: Hackathon Wins -->
  <g transform="translate(16, 104)">
    <rect width="288" height="44" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="15" r="2.5" fill="#38BDF8" />
    <text x="20" y="18" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">3X HACKATHON WINNER</text>
    <text x="12" y="34" class="sans" font-size="10" fill="#93C5FD">SnowFrost '26 &#8226; InOutHacks '26 &#8226; SheBuilds Global</text>
  </g>

  <!-- Metric 2: GSSoC Top 2% -->
  <g transform="translate(316, 104)">
    <rect width="288" height="44" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="15" r="2.5" fill="#38BDF8" />
    <text x="20" y="18" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">GLOBAL RANK #818 / 47,935</text>
    <text x="12" y="34" class="sans" font-size="10" fill="#93C5FD">GSSoC 2026 (Top 2% Global Open Source)</text>
  </g>

  <!-- Metric 3: Smartly Infra -->
  <g transform="translate(16, 156)">
    <rect width="288" height="44" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="15" r="2.5" fill="#38BDF8" />
    <text x="20" y="18" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">GLOBAL RANK #93</text>
    <text x="12" y="34" class="sans" font-size="10" fill="#93C5FD">Smartly Infra AI Agents Global Track</text>
  </g>

  <!-- Metric 4: SheBuilds S3 -->
  <g transform="translate(316, 156)">
    <rect width="288" height="44" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="15" r="2.5" fill="#38BDF8" />
    <text x="20" y="18" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">TOP 210 BUILDERS WORLDWIDE</text>
    <text x="12" y="34" class="sans" font-size="10" fill="#93C5FD">SheBuilds S3 by Lovable (from 3,000+ builders)</text>
  </g>

  <!-- Footer Telemetry Line -->
  <line x1="16" y1="210" x2="604" y2="210" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
  <text x="16" y="224" class="mono" font-size="9.5" fill="#60A5FA">// TELEMETRY: HARD PROBLEMS &#8226; ZERO FLUFF &#8226; MEASURABLE REAL-WORLD IMPACT</text>
</svg>