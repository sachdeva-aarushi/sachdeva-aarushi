<svg width="620" height="248" viewBox="0 0 620 248" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Pro Mono', 'Segoe UI Mono', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
    }
  </style>

  <!-- Outer Console Container -->
  <rect x="1" y="1" width="618" height="246" rx="8" fill="#07111E" stroke="#1E3A8A" stroke-width="1.2" />

  <!-- Console Header Bar -->
  <circle cx="18" cy="20" r="4" fill="#38BDF8" />
  <text x="28" y="24" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#93C5FD">TARGET_ACQUISITION // ACTIVE_ENGINEERING_TARGETS</text>
  <text x="602" y="24" class="mono" font-size="10" fill="#60A5FA" text-anchor="end">RADAR: LOCKED // 4 VECTORS</text>
  <line x1="16" y1="34" x2="604" y2="34" stroke="#1E3A8A" stroke-width="1" opacity="0.5" />

  <!-- Directive Body Text -->
  <g transform="translate(16, 46)">
    <text x="0" y="12" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      I don't build toy projects or shallow wrappers. My telemetry is locked onto
    </text>
    <text x="0" y="28" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      high-friction engineering challenges where <tspan fill="#38BDF8" font-weight="600">deterministic safety</tspan>, <tspan fill="#38BDF8" font-weight="600">low latency</tspan>, and
    </text>
    <text x="0" y="44" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">
      <tspan fill="#38BDF8" font-weight="600">measurable human consequence</tspan> decide whether a system survives production.
    </text>
  </g>

  <!-- Telemetry Target Cards (2x2 Grid) -->
  <!-- Target 1 -->
  <g transform="translate(16, 102)">
    <rect width="288" height="48" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="16" r="2.5" fill="#38BDF8" />
    <text x="20" y="19" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">TARGET 01 // MULTI-AGENT SWARMS</text>
    <text x="12" y="36" class="sans" font-size="10" fill="#93C5FD">Deterministic pipelines, shared memory &amp; guardrails</text>
  </g>

  <!-- Target 2 -->
  <g transform="translate(316, 102)">
    <rect width="288" height="48" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="16" r="2.5" fill="#38BDF8" />
    <text x="20" y="19" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">TARGET 02 // INDUSTRIAL RISK &amp; TWINS</text>
    <text x="12" y="36" class="sans" font-size="10" fill="#93C5FD">Correlating sensor signals &amp; hazardous event telemetry</text>
  </g>

  <!-- Target 3 -->
  <g transform="translate(16, 158)">
    <rect width="288" height="48" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="16" r="2.5" fill="#38BDF8" />
    <text x="20" y="19" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">TARGET 03 // DECENTRALIZED CIVIC TECH</text>
    <text x="12" y="36" class="sans" font-size="10" fill="#93C5FD">Trustless agritech ledgers &amp; verifiable public data</text>
  </g>

  <!-- Target 4 -->
  <g transform="translate(316, 158)">
    <rect width="288" height="48" rx="5" fill="#0B192C" stroke="#1D4ED8" stroke-width="1.1" />
    <circle cx="12" cy="16" r="2.5" fill="#38BDF8" />
    <text x="20" y="19" class="mono" font-size="10.5" font-weight="700" fill="#F8FAFC">TARGET 04 // HIGH-IMPACT HEALTHCARE</text>
    <text x="12" y="36" class="sans" font-size="10" fill="#93C5FD">Hospital procurement triage &amp; maternal recovery AI</text>
  </g>

  <!-- Footer Telemetry Line -->
  <line x1="16" y1="218" x2="604" y2="218" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
  <text x="16" y="233" class="mono" font-size="9.5" fill="#60A5FA">// TELEMETRY: HARD PROBLEMS &#8226; DETERMINISTIC DEFENSE &#8226; ZERO FLUFF</text>
</svg>